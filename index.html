<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Ticket Sales</title><style>*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;background:#f5f6fb;color:#20233a}button,input,select{font:inherit;font-size:16px}button{cursor:pointer}body{padding-bottom:80px}.main{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:24px;font-weight:950;color:#4825d0}.owner{background:#fff;border:1px solid #e8e6ef;border-radius:24px;padding:9px 14px;font-weight:800}.view{display:none}.view.active{display:block}.panel{background:#fff;border:1px solid #e5e3ee;border-radius:22px;padding:16px;box-shadow:0 12px 35px #35207d10}.h2{margin:0 0 14px;color:#4825d0;font-size:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:15px;border-radius:17px;background:linear-gradient(145deg,#eee6ff,#f8fbff)}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:#747888}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:5px 3px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #21104710}.bottom button{border:0;background:transparent;color:#777;font-weight:850;border-radius:13px;min-width:70px}.bottom button.active{color:#5528dc;background:#f0eaff}.bottom span{display:block;font-size:20px}.ticketSlider{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 14px}.ticketSlider::-webkit-scrollbar{display:none}.ticket{flex:0 0 78%;max-width:330px;scroll-snap-align:center;border:1px solid #e4e1ed;border-radius:20px;padding:10px;background:#fff;box-shadow:0 12px 28px #35207d12}.ticketImg{height:205px;border-radius:15px;background:linear-gradient(145deg,#f7f2ff,#edf5ff);display:flex;align-items:center;justify-content:center;overflow:hidden}.ticketImg img{width:100%;height:100%;object-fit:contain;object-position:center}.emoji{font-size:64px}.ticketName{text-align:center;font-weight:950;font-size:18px;margin:9px 2px 2px}.price{text-align:center;color:#5829d8;font-weight:950}.q{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:9px;padding:6px;border-radius:14px;background:#f3efff}.q button{width:46px;height:44px;border:0;border-radius:11px;background:#fff;color:#5528dc;font-size:27px;font-weight:950}.q input{width:70px;height:44px;text-align:center;border:1px solid #dcd5f5;border-radius:11px;font-weight:950}.dots{text-align:center;color:#9a8be0;font-size:18px;letter-spacing:4px}.total{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding:16px;border-radius:19px;background:linear-gradient(135deg,#f3edff,#eef6ff)}.total small{display:block;color:#7a7d8a;font-size:11px;font-weight:800}.total b{font-size:24px;color:#4525cd}.amount{text-align:right}.amount b{color:#198447}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;min-height:47px;padding:12px;border:1px solid #dddbe7;border-radius:12px;background:#fff}.actions{display:flex;gap:9px;margin-top:13px}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:950;min-height:47px}.primary{background:linear-gradient(110deg,#6735f4,#b62cec);color:#fff;flex:1}.light{background:#fff0f4;color:#ce4b70}.settingGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settingCard{border:1px solid #e5e2ef;border-radius:18px;padding:18px}.settingCard button{width:100%;border:0;background:transparent;text-align:left}.settingIcon{font-size:35px}.settingCard b{display:block;color:#4825d0;margin-top:6px}.sub{display:flex;align-items:center;gap:10px;margin-bottom:15px}.back{border:0;background:#f0eaff;color:#5528dc;border-radius:12px;padding:10px 13px;font-weight:900}.manageGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manageCard{border:1px solid #e5e2ed;border-radius:17px;padding:9px}.manageCard .ticketImg{height:150px}.manageActions{display:flex;gap:7px;margin-top:9px}.edit,.delete{border:0;border-radius:10px;min-height:43px;font-weight:900;flex:1}.edit{background:#eee8ff;color:#5429d9}.delete{background:#fff0f0;color:#d34848}.eventList{display:grid;gap:9px;margin-top:14px}.eventItem{display:flex;align-items:center;gap:10px;border:1px solid #e6e3ed;border-radius:14px;padding:12px}.grow{flex:1}.historyRow{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.modal{display:none;position:fixed;inset:0;z-index:50;background:#17132966;align-items:center;justify-content:center;padding:16px}.modal .panel{width:min(430px,100%);max-height:90vh;overflow:auto}.preview{height:180px!important;margin-top:10px}@media(min-width:701px){body{padding-bottom:0}.bottom{display:none}.desktopNav{display:flex;gap:7px;margin-bottom:15px}.desktopNav button{border:0;background:#fff;border-radius:12px;padding:11px 15px;font-weight:850}.desktopNav button.active{background:#eee8ff;color:#5528dc}.ticket{flex-basis:280px}.ticketSlider{justify-content:flex-start}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.desktopNav{display:none}.stats{grid-template-columns:1fr 1fr}.settingGrid{grid-template-columns:1fr}.panel{padding:13px}.ticket{flex-basis:82%}.ticketImg{height:190px}.h2{font-size:22px}.brand{font-size:22px}.total b{font-size:21px}}
</style></head><body><main class="main"><header class="top"><div class="brand">🎟️ Ticket Sales</div><div class="owner">👤 Owner</div></header><nav class="desktopNav"><button data-page="dashboard" class="active">🏠 Dashboard</button><button data-page="sales">🎟️ Sale</button><button data-page="history">📋 History</button><button data-page="settings">⚙️ Setting</button></nav><section id="dashboard" class="view active"><div class="panel"><h2 class="h2">📊 Dashboard</h2><div class="stats"><div class="stat"><b id="dTypes">0</b><span>Ticket Types</span></div><div class="stat"><b id="dSales">0</b><span>Total Sales</span></div><div class="stat"><b id="dEvents">0</b><span>Total Events</span></div><div class="stat"><b id="dToday">0</b><span>Today Tickets</span></div></div></div></section><section id="sales" class="view"><div class="panel"><h2 class="h2">🎟️ Ticket Sale</h2><div id="saleTickets" class="ticketSlider"></div><div id="dots" class="dots"></div><div class="total"><div><small>TOTAL TICKETS</small><b id="totalQ">0 စောင်</b></div><div class="amount"><small>TOTAL AMOUNT</small><b id="totalA">฿0</b></div></div><div class="field"><label>📍 Event</label><select id="saleEvent"><option value="">Event ရွေးပါ</option></select></div><div class="field"><label>📅 Date</label><input id="saleDate" type="date"></div><div class="actions"><button class="btn light" id="reset">Reset</button><button class="btn primary" id="save">💾 Save Sale</button></div></div></section><section id="history" class="view"><div class="panel"><h2 class="h2">📋 Sales History</h2><div class="field"><input id="search" placeholder="🔍 Ticket / Event / Date ရှာရန်"></div><div id="historyList"></div></div></section><section id="settings" class="view"><div id="settingHome" class="panel"><h2 class="h2">⚙️ Setting</h2><div class="settingGrid"><div class="settingCard"><button id="openTickets"><div class="settingIcon">🎫</div><b>Ticket Add</b><small>Ticket အမည်၊ ဈေးနှုန်း၊ ပုံ စီမံရန်</small></button></div><div class="settingCard"><button id="openEvents"><div class="settingIcon">📍</div><b>Event</b><small>Event / Location စီမံရန်</small></button></div></div></div><div id="ticketPage" class="panel" style="display:none"><div class="sub"><button class="back" id="backTicket">← Back</button><h2 class="h2">🎫 Ticket Add</h2></div><button class="btn primary" id="addTicketBtn">＋ Add Ticket</button><div id="manageTickets" class="manageGrid" style="margin-top:14px"></div></div><div id="eventPage" class="panel" style="display:none"><div class="sub"><button class="back" id="backEvent">← Back</button><h2 class="h2">📍 Event</h2></div><div class="field" style="margin-top:0"><label>Event / Location Name</label><input id="eventName" placeholder="ဥပမာ Pattaya Dinosaur Kingdom"></div><button class="btn primary" id="addEventBtn" style="margin-top:12px;width:100%">＋ Add Event</button><div id="eventList" class="eventList"></div></div></section></main><nav class="bottom"><button data-page="dashboard" class="active"><span>🏠</span>Home</button><button data-page="sales"><span>🎟️</span>Sale</button><button data-page="history"><span>📋</span>History</button><button data-page="settings"><span>⚙️</span>Setting</button></nav><div id="modal" class="modal"><div class="panel"><h2 id="modalTitle" class="h2">🎫 Add Ticket</h2><div class="field"><label>Ticket Name</label><input id="newName" placeholder="Entry Ticket"></div><div class="field"><label>Price</label><input id="newPrice" type="number" min="0" placeholder="100"></div><div class="field"><label>Ticket Image</label><input id="newImage" type="file" accept="image/*"></div><div id="preview" class="ticketImg preview" style="display:none"><img id="previewImg"></div><div class="actions"><button class="btn light" id="cancelModal">Cancel</button><button class="btn primary" id="confirmTicket">Add Ticket</button></div></div></div><script>const KEY='ticketSalesApp_NEW_V4',id=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);let tickets=JSON.parse(localStorage.getItem(KEY+'_tickets')||'[]'),sales=JSON.parse(localStorage.getItem(KEY+'_sales')||'[]'),events=JSON.parse(localStorage.getItem(KEY+'_events')||'[]'),qty={},editId=null;if(!tickets.length){tickets=[{id:1,name:'Entry Ticket',price:0,img:''},{id:2,name:'Playing Ticket',price:0,img:''},{id:3,name:'VIP Ticket',price:0,img:''}];save()}function save(){localStorage.setItem(KEY+'_tickets',JSON.stringify(tickets));localStorage.setItem(KEY+'_sales',JSON.stringify(sales));localStorage.setItem(KEY+'_events',JSON.stringify(events))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function img(t){return t.img?`<img src="${t.img}" alt="${esc(t.name)}">`:'<div class="emoji">🎟️</div>'}function show(p){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));id(p).classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p!=='settings')closeSub();renderAll()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));function renderSale(){id('saleTickets').innerHTML=tickets.map(t=>`<div class="ticket"><div class="ticketImg">${img(t)}</div><div class="ticketName">${esc(t.name)}</div><div class="price">฿${Number(t.price||0).toLocaleString()}</div><div class="q"><button data-minus="${t.id}">−</button><input id="q${t.id}" value="${qty[t.id]||0}" inputmode="numeric"><button data-plus="${t.id}">＋</button></div></div>`).join('')||'<div>Ticket မရှိသေးပါ</div>';id('dots').textContent=tickets.length?'• '.repeat(Math.min(tickets.length,8)):'';tickets.forEach(t=>{let q=id('q'+t.id);if(q)q.onchange=()=>{qty[t.id]=Math.max(0,parseInt(q.value)||0);total()}});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let i=b.dataset.minus;qty[i]=Math.max(0,(qty[i]||0)-1);renderSale()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{let i=b.dataset.plus;qty[i]=(qty[i]||0)+1;renderSale()});total();let cur=id('saleEvent').value;id('saleEvent').innerHTML='<option value="">Event ရွေးပါ</option>'+events.map(e=>`<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');if(events.some(e=>e.name===cur))id('saleEvent').value=cur}function total(){let q=0,a=0;tickets.forEach(t=>{let n=qty[t.id]||0;q+=n;a+=n*Number(t.price||0)});id('totalQ').textContent=q+' စောင်';id('totalA').textContent='฿'+a.toLocaleString()}function reset(){qty={};id('saleEvent').value='';id('saleDate').value=today();renderSale()}function saveSale(){let items=[],q=0,a=0;tickets.forEach(t=>{let n=qty[t.id]||0;if(n){items.push({name:t.name,price:t.price,qty:n,img:t.img});q+=n;a+=n*Number(t.price||0)}});if(!items.length)return alert('Ticket အရေအတွက် ထည့်ပါ');if(!id('saleEvent').value)return alert('Event ရွေးပါ');sales.unshift({id:Date.now(),date:id('saleDate').value||today(),event:id('saleEvent').value,items,totalQ:q,totalA:a});save();reset();show('history');alert('Sale သိမ်းပြီးပါပြီ')}function renderHistory(q=''){let s=String(q).toLowerCase(),r=sales.filter(x=>(x.event+' '+x.date+' '+x.items.map(i=>i.name).join(' ')).toLowerCase().includes(s));id('historyList').innerHTML=r.map(x=>`<div class="historyRow"><div class="grow"><b>📍 ${esc(x.event)}</b><small>📅 ${esc(x.date)} · ${x.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</small></div><strong>฿${Number(x.totalA||0).toLocaleString()}</strong><button class="delete" data-sdel="${x.id}">🗑️</button></div>`).join('')||'<div style="padding:25px;text-align:center;color:#888">Sales History မရှိသေးပါ။</div>';document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{sales=sales.filter(x=>x.id!=b.dataset.sdel);save();renderAll()})}function renderDash(){id('dTypes').textContent=tickets.length;id('dSales').textContent=sales.length;id('dEvents').textContent=new Set(sales.map(x=>x.event)).size;id('dToday').textContent=sales.filter(x=>x.date===today()).reduce((n,x)=>n+x.totalQ,0)}function renderManage(){id('manageTickets').innerHTML=tickets.map(t=>`<div class="manageCard"><div class="ticketImg">${img(t)}</div><div class="ticketName">${esc(t.name)}</div><div class="price">฿${Number(t.price||0).toLocaleString()}</div><div class="manageActions"><button class="edit" data-edit="${t.id}">✏️ Edit</button><button class="delete" data-del="${t.id}">🗑️ Delete</button></div></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('ဒီ Ticket ကို ဖျက်မလား?')){tickets=tickets.filter(t=>t.id!=b.dataset.del);save();renderAll()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let t=tickets.find(x=>x.id==b.dataset.edit);if(t)openModal(t)})}function renderEvents(){id('eventList').innerHTML=events.map(e=>`<div class="eventItem"><span>📍</span><div class="grow"><b>${esc(e.name)}</b><small>Event / Location</small></div><button class="delete" data-edel="${e.id}">🗑️</button></div>`).join('')||'<div style="padding:20px;text-align:center;color:#888">Event မရှိသေးပါ</div>';document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{events=events.filter(e=>e.id!=b.dataset.edel);save();renderEvents();renderSale()})}function renderAll(){renderSale();renderHistory(id('search').value);renderDash();if(id('ticketPage').style.display!=='none')renderManage();if(id('eventPage').style.display!=='none')renderEvents()}function closeSub(){id('settingHome').style.display='block';id('ticketPage').style.display='none';id('eventPage').style.display='none'}id('openTickets').onclick=()=>{id('settingHome').style.display='none';id('ticketPage').style.display='block';renderManage()};id('openEvents').onclick=()=>{id('settingHome').style.display='none';id('eventPage').style.display='block';renderEvents()};id('backTicket').onclick=closeSub;id('backEvent').onclick=closeSub;function openModal(t){editId=t?Number(t.id):null;id('modalTitle').textContent=editId?'✏️ Edit Ticket':'🎫 Add Ticket';id('confirmTicket').textContent=editId?'Save Changes':'Add Ticket';id('newName').value=t?t.name:'';id('newPrice').value=t?t.price:'';id('newImage').value='';id('preview').style.display=t&&t.img?'flex':'none';if(t&&t.img)id('previewImg').src=t.img;id('modal').style.display='flex'}function closeModal(){id('modal').style.display='none';editId=null}id('newImage').onchange=()=>{let f=id('newImage').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{id('previewImg').src=r.result;id('preview').style.display='flex'};r.readAsDataURL(f)};id('confirmTicket').onclick=()=>{let n=id('newName').value.trim(),p=Number(id('newPrice').value)||0,f=id('newImage').files[0];if(!n)return alert('Ticket Name ထည့်ပါ');let old=editId?tickets.find(t=>t.id===editId):null;let done=im=>{if(old){old.name=n;old.price=p;if(f)old.img=im}else tickets.push({id:Date.now(),name:n,price:p,img:im||''});save();closeModal();renderAll()};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done(old?old.img:'')};id('cancelModal').onclick=closeModal;id('addTicketBtn').onclick=()=>openModal(null);id('addEventBtn').onclick=()=>{let n=id('eventName').value.trim();if(!n)return alert('Event / Location အမည်ထည့်ပါ');if(!events.some(e=>e.name.toLowerCase()===n.toLowerCase()))events.push({id:Date.now(),name:n});id('eventName').value='';save();renderEvents();renderSale()};id('search').oninput=e=>renderHistory(e.target.value);id('reset').onclick=reset;id('save').onclick=saveSale;id('saleDate').value=today();renderAll();</script></body></html>
