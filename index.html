t-align:left}.settingIcon{font-size:36px}.settingCard b{display:block;color:#4322c9;font-size:17px;margin-top:7px}.sub{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{border:0;background:#f1ebff;color:#5429d9;border-radius:12px;padding:10px 13px;font-weight:900;min-height:44px}.eventList{display:grid;gap:10px;margin-top:16px}.eventItem{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #e8e5f2;border-radius:15px}.eventItem .grow,.historyRow .grow{flex:1}.historyRow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.historyRow small{display:block;color:#838795;font-size:11px}.bottom{display:none}#modal{display:none;position:fixed;inset:0;background:#16132c66;z-index:50;align-items:center;justify-content:center;padding:18px}.modalPanel{width:min(430px,100%);max-height:90vh;overflow:auto}@media(max-width:700px){body{padding-bottom:76px}.side{display:none}.main{margin:0;padding:12px 10px 90px;width:100%;max-width:none}.top{margin-bottom:12px}.brand{font-size:22px}.owner{padding:8px 11px;font-size:13px}.panel{padding:14px;border-radius:18px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat b{font-size:23px}.ticketStage{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ticket{padding:8px;border-radius:15px}.ticketImg{height:135px}.ticketName{font-size:12px}.price{font-size:11px}.q{gap:3px}.q button{width:38px}.q input{width:50px}.total{padding:13px}.total b{font-size:21px}.bottom{position:fixed;display:flex;z-index:30;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #eee;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #2110470b}.bottom button{border:0;background:transparent;color:#777;font-weight:800;min-width:68px;border-radius:12px}.bottom button.active{color:#5528dc;background:#f1ebff}.bottom span{display:block;font-size:20px}.settingGrid{grid-template-columns:1fr}.historyRow{gap:7px}.historyRow strong{font-size:13px}.manageActions{gap:6px}.manageActions button{font-size:12px;padding:9px 5px}.edit,.delete{min-width:0}.sub .h2{font-size:20px}}@media(min-width:701px){.bottom{display:none}}</style></head><body><aside class="side"><div class="logo"><span>🎟️</span> TICKET SALES</div><nav class="nav"><button class="active" data-page="dashboard">🏠 Dashboard</button><button data-page="sales">🎟️ Ticket Sale</button><button data-page="history">📋 Sales History</button><button data-page="settings">⚙️ Setting</button></nav></aside><main class="main"><header class="top"><div class="brand">🎟️ Ticket Sales</div><div class="owner">👤 Owner</div></header><section id="dashboard" class="view active"><div class="panel"><h2 class="h2">📊 Dashboard</h2><div class="stats"><div class="stat"><b id="dTypes">0</b><span>Ticket Types</span></div><div class="stat"><b id="dSales">0</b><span>Total Sales</span></div><div class="stat"><b id="dEvents">0</b><span>Total Events</span></div><div class="stat"><b id="dToday">0</b><span>Today Tickets</span></div></div></div></section><section id="sales" class="view"><div class="panel"><h2 class="h2">🎟️ Ticket Sale</h2><div id="saleTickets" class="ticketStage"></div><div class="total"><div><small>TOTAL TICKETS</small><b id="totalQ">0 စောင်</b></div><div class="amount"><small>TOTAL AMOUNT</small><b id="totalA">฿0</b></div></div><div class="field"><label>📍 Event</label><select id="saleEvent"><option value="">Event ရွေးပါ</option></select></div><div class="field"><label>📅 Date</label><input id="saleDate" type="date"></div><div class="actions"><button class="btn light" id="reset">Reset</button><button class="btn primary" id="save">💾 Save Sale</button></div></div></section><section id="history" class="view"><div class="panel"><h2 class="h2">📋 Sales History</h2><div class="field"><input id="search" placeholder="🔍 Ticket / Event / Date ရှာရန်"></div><div id="historyList"></div></div></section><section id="settings" class="view"><div id="settingHome" class="panel"><h2 class="h2">⚙️ Setting</h2><div class="settingGrid"><div class="settingCard"><button id="openTickets"><div class="settingIcon">🎫</div><b>Ticket Add</b></button></div><div class="settingCard"><button id="openEvents"><div class="settingIcon">📍</div><b>Event</b></button></div></div></div><div id="ticketPage" class="panel" style="display:none"><div class="sub"><button class="back" id="backTicket">← Back</button><h2 class="h2">🎫 Ticket Add</h2></div><div class="actions" style="margin-top:0"><button class="btn primary" id="addTicketBtn">＋ Add Ticket</button></div><div id="manageTickets" class="ticketStage" style="margin-top:14px"></div></div><div id="eventPage" class="panel" style="display:none"><div class="sub"><button class="back" id="backEvent">← Back</button><h2 class="h2">📍 Event</h2></div><div class="field" style="margin-top:0"><label>Event / Location Name</label><input id="eventName" placeholder="ဥပမာ Pattaya Dinosaur Kingdom"></div><div class="actions"><button class="btn primary" id="addEventBtn">＋ Add Event</button></div><div id="eventList" class="eventList"></div></div></section></main><nav class="bottom"><button class="active" data-page="dashboard"><span>🏠</span>Home</button><button data-page="sales"><span>🎟️</span>Sale</button><button data-page="history"><span>📋</span>History</button><button data-page="settings"><span>⚙️</span>Setting</button></nav><div id="modal"><div class="panel modalPanel"><h2 class="h2" id="modalTitle">🎫 Add Ticket</h2><div class="field"><label>Ticket Name</label><input id="newName" placeholder="100 Baht Ticket"></div><div class="field"><label>Price</label><input id="newPrice" type="number" min="0" placeholder="100"></div><div class="field"><label>Ticket Image</label><input id="newImage" type="file" accept="image/*"></div><div id="previewWrap" class="ticketImg" style="margin-top:12px;height:180px;display:none"><img id="previewImg" alt="Preview"></div><div class="actions"><button class="btn light" id="cancelModal">Cancel</button><button class="btn primary" id="confirmTicket">Add Ticket</button></div></div></div><script>const K='ticketSalesApp_NEW_V4',$=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);let tickets=JSON.parse(localStorage.getItem(K+'_tickets')||'[]'),sales=JSON.parse(localStorage.getItem(K+'_sales')||'[]'),events=JSON.parse(localStorage.getItem(K+'_events')||'[]'),qty={},editingId=null;if(!tickets.length){tickets=[{id:1,name:'Entry Ticket',price:0,img:''},{id:2,name:'Playing Ticket',price:0,img:''},{id:3,name:'VIP Ticket',price:0,img:''}];saveData()}if(!events.length){events=[...new Set(sales.map(s=>s.event).filter(e=>e&&e!=='—'))].map((name,i)=>({id:Date.now()+i,name}));saveData()}function saveData(){localStorage.setItem(K+'_tickets',JSON.stringify(tickets));localStorage.setItem(K+'_sales',JSON.stringify(sales));localStorage.setItem(K+'_events',JSON.stringify(events))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(page){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(page).classList.add('active');if(page!=='settings')closeSub();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderAll()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));function openTicketPage(){$('settingHome').style.display='none';$('eventPage').style.display='none';$('ticketPage').style.display='block';renderManage()}function openEventPage(){$('settingHome').style.display='none';$('ticketPage').style.display='none';$('eventPage').style.display='block';renderEvents()}function closeSub(){$('settingHome').style.display='block';$('ticketPage').style.display='none';$('eventPage').style.display='none'}$('openTickets').onclick=openTicketPage;$('openEvents').onclick=openEventPage;$('backTicket').onclick=closeSub;$('backEvent').onclick=closeSub;function renderAll(){renderSale();renderHistory($('search').value);renderDashboard();if($('ticketPage').style.display!=='none')renderManage();if($('eventPage').style.display!=='none')renderEvents()}function ticketImage(t){return t.img?`<img src="${t.img}" alt="${esc(t.name)}">`:'<div class="emoji">🎟️</div>'}function renderSale(){let h=tickets.map(t=>`<div class="ticket"><div class="ticketImg">${ticketImage(t)}</div><div class="ticketName">${esc(t.name)}</div><div class="price">฿${Number(t.price||0).toLocaleString()}</div><div class="q"><button type="button" data-minus="${t.id}">−</button><input id="q_${t.id}" value="${qty[t.id]||0}" inputmode="numeric"><button type="button" data-plus="${t.id}">＋</button></div></div>`).join('');$('saleTickets').innerHTML=h||'<div style="padding:20px">Ticket မရှိသေးပါ</div>';tickets.forEach(t=>{const qEl=$('q_'+t.id);if(qEl)qEl.onchange=()=>{qty[t.id]=Math.max(0,parseInt(qEl.value)||0);updateTotal()}});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let id=b.dataset.minus;qty[id]=Math.max(0,(qty[id]||0)-1);renderSale()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{let id=b.dataset.plus;qty[id]=(qty[id]||0)+1;renderSale()});updateTotal();let cur=$('saleEvent').value;$('saleEvent').innerHTML='<option value="">Event ရွေးပါ</option>'+events.map(e=>`<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');if(events.some(e=>e.name===cur))$('saleEvent').value=cur}function updateTotal(){let q=0,a=0;tickets.forEach(t=>{let n=qty[t.id]||0;q+=n;a+=n*Number(t.price||0)});$('totalQ').textContent=q+' စောင်';$('totalA').textContent='฿'+a.toLocaleString()}function resetSale(){qty={};$('saleEvent').value='';$('saleDate').value=today();renderSale()}function saveSale(){let items=[],totalQ=0,totalA=0;tickets.forEach(t=>{let n=qty[t.id]||0;if(n){items.push({id:t.id,name:t.name,price:t.price,qty:n,img:t.img});totalQ+=n;totalA+=n*Number(t.price||0)}});if(!items.length)return alert('Ticket အရေအတွက် ထည့်ပါ');if(!$('saleEvent').value)return alert('Event ရွေးပါ');sales.unshift({id:Date.now(),date:$('saleDate').value||today(),event:$('saleEvent').value,items,totalQ,totalA});saveData();resetSale();show('history');alert('Sale သိမ်းပြီးပါပြီ')}function renderHistory(q=''){let s=String(q||'').toLowerCase(),rows=sales.filter(x=>`${x.event} ${x.date} ${x.items.map(i=>i.name).join(' ')}`.toLowerCase().includes(s));$('historyList').innerHTML=rows.map(x=>`<div class="historyRow"><div class="grow"><b>📍 ${esc(x.event)}</b><small>📅 ${esc(x.date)} · ${x.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</small></div><strong>฿${Number(x.totalA||0).toLocaleString()}</strong><button class="delete" data-sdel="${x.id}">🗑️</button></div>`).join('')||'<div style="padding:25px;text-align:center;color:#888">Sales History မရှိသေးပါ။</div>';document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{sales=sales.filter(x=>x.id!=b.dataset.sdel);saveData();renderAll()})}function renderDashboard(){let ev=new Set(sales.map(x=>x.event)).size,td=sales.filter(x=>x.date===today()).reduce((n,x)=>n+Number(x.totalQ||0),0);$('dTypes').textContent=tickets.length;$('dSales').textContent=sales.length;$('dEvents').textContent=ev;$('dToday').textContent=td}function renderManage(){$('manageTickets').innerHTML=tickets.map(t=>`<div class="ticket"><div class="ticketImg">${ticketImage(t)}</div><div class="ticketName">${esc(t.name)}</div><div class="price">฿${Number(t.price||0).toLocaleString()}</div><div class="manageActions"><button class="edit" data-tedit="${t.id}">✏️ Edit</button><button class="delete" data-tdel="${t.id}">🗑️ Delete</button></div></div>`).join('')||'<div style="padding:20px">Ticket မရှိသေးပါ</div>';document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{if(!confirm('ဒီ Ticket ကို ဖျက်မလား?'))return;tickets=tickets.filter(t=>t.id!=b.dataset.tdel);saveData();renderAll()});document.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>{let t=tickets.find(x=>x.id==b.dataset.tedit);if(t)openModal(t)})}function renderEvents(){$('eventList').innerHTML=events.map(e=>`<div class="eventItem"><div>📍</div><div class="grow"><b>${esc(e.name)}</b><small>Event / Location</small></div><button class="delete" data-edel="${e.id}">🗑️</button></div>`).join('')||'<div style="color:#888;text-align:center;padding:20px">Event မရှိသေးပါ</div>';document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{events=events.filter(e=>e.id!=b.dataset.edel);saveData();renderEvents();renderSale()})}function openModal(t){editingId=t?Number(t.id):null;$('modalTitle').textContent=editingId?'✏️ Edit Ticket':'🎫 Add Ticket';$('confirmTicket').textContent=editingId?'Save Changes':'Add Ticket';$('newName').value=t?t.name:'';$('newPrice').value=t?t.price:'';$('newImage').value='';$('previewWrap').style.display=t&&t.img?'flex':'none';if(t&&t.img)$('previewImg').src=t.img;$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none';editingId=null;$('newImage').value='';$('previewWrap').style.display='none'}$('newImage').onchange=()=>{let f=$('newImage').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{$('previewImg').src=r.result;$('previewWrap').style.display='flex'};r.readAsDataURL(f)};function saveTicket(){let n=$('newName').value.trim(),p=Number($('newPrice').value)||0,f=$('newImage').files[0];if(!n)return alert('Ticket Name ထည့်ပါ');let old=editingId?tickets.find(t=>t.id==editingId):null;let done=img=>{if(old){old.name=n;old.price=p;if(f)old.img=img}else tickets.push({id:Date.now(),name:n,price:p,img:img||''});saveData();closeModal();renderAll()};if(f){let r=new FileReader;r.onload=()=>done(r.result);r.readAsDataURL(f)}else done(old?old.img:'')}$('addTicketBtn').onclick=()=>openModal(null);$('cancelModal').onclick=closeModal;$('confirmTicket').onclick=saveTicket;$('addEventBtn').onclick=()=>{let n=$('eventName').value.trim();if(!n)return alert('Event / Location အမည်ထည့်ပါ');if(!events.some(e=>e.name.toLowerCase()===n.toLowerCase()))events.push({id:Date.now(),name:n});$('eventName').value='';saveData();renderEvents();renderSale()};$('search').oninput=e=>renderHistory(e.target.value);$('reset').onclick=resetSale;$('save').onclick=saveSale;$('saleDate').value=today();renderAll();</script></body></html>
